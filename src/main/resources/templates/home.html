<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Poly Paste</title>
</head>
<body>

<h2>Poly Paste</h2>

<textarea id="textInput" style="width: 100%; height: 200px;" placeholder="Введите текст здесь..."></textarea>

<button id="submitBtn">Сгенерировать ссылку</button>

<div id="result"></div>

<script>
    const submitBtn = document.getElementById('submitBtn');
    const textInput = document.getElementById('textInput');
    const resultDiv = document.getElementById('result');

    submitBtn.addEventListener('click', async () => {
        const textValue = textInput.value;

        // Формируем объект для отправки
        const data = {
            text: textValue
        };

        try {
            // Замените '/' на ваш реальный URL эндпоинта
            const response = await fetch('/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                const result = await response.json();
                resultDiv.innerHTML = `<p>Успешно! Ссылка: <a href="${result.url}">${result.url}</a></p>`;
            } else {
                resultDiv.innerText = 'Ошибка при отправке: ' + response.statusText;
            }
        } catch (error) {
            resultDiv.innerText = 'Произошла ошибка сети: ' + error.message;
        }
    });
</script>

</body>
</html>
