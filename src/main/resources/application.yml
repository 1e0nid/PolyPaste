      output: q2
    exchange: moderation-exchange
    routing-key:
      input: moderation.input
      output: moderation.output
  ml:
    model-path: src/main/resources/models/rubert-tiny-toxic.onnx
    threshold: 0.3

  minio:
    endpoint: http://localhost:9000
    access-key: admin
    secret-key: admin
    bucket: pastes
    auto-create-bucket: true

