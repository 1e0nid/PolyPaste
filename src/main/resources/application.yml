spring:
  application:
    name: PolyPaste

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin

  datasource:
    url: jdbc:postgresql://localhost:5439/Poly_Paste
    username: admin
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
